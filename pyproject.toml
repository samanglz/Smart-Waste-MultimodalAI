[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-waste-multimodal-ai"
version = "0.1.0"
description = "Modular multimodal waste detection and recycling knowledge system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "onnxruntime>=1.23,<2",
    "Pillow>=10.4,<13",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3.0",
    "sentence-transformers>=3.0,<6.0",
    "faiss-cpu>=1.8,<2.0",
    "rank-bm25>=0.2.2,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
generation = [
    "google-genai>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = [
    "backups/**",
    "experiments/backups/**",
    "experiments/evaluation/audits/*_backup_*/**",
]
